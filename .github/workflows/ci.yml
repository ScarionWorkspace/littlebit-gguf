name: ci
on:
  push:
    branches: [main]
  pull_request:
jobs:
  python-reference:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install (CPU torch)
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt
      - name: gguf-py from llama.cpp (pinned to Ollama's LLAMA_CPP_VERSION)
        run: |
          git clone --depth 1 --branch b12257 --filter=blob:none --sparse \
            https://github.com/ggml-org/llama.cpp.git "$RUNNER_TEMP/llama.cpp"
          git -C "$RUNNER_TEMP/llama.cpp" sparse-checkout set gguf-py
          pip install pyyaml tqdm
      - name: Unit tests (no model downloads)
        env:
          LLAMA_CPP_DIR: ${{ runner.temp }}/llama.cpp
        run: pytest -q -rs tests
